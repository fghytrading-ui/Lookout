services:
  - type: web
    name: project-lookout
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm start
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: FINNHUB_API_KEY
        sync: false   # User adds via Render dashboard (not in git)
      - key: FRED_API_KEY
        sync: false   # User adds via Render dashboard (not in git)
      # Alpaca supplies the daily bars — 146 of 150 series locally, six years
      # of history, and no rate limiting. Without these the deployed site
      # silently falls back to Yahoo candles and the feeds panel shows 9 of 10
      # rather than 10, which is how this was noticed.
      - key: ALPACA_KEY_ID
        sync: false   # User adds via Render dashboard (not in git)
      - key: ALPACA_SECRET_KEY
        sync: false   # User adds via Render dashboard (not in git)
      # CoinGecko's keyless endpoint answers a laptop and refuses Render:
      # measured 2026-08-31, every call from the live host came back empty
      # while the same call from home returned 200 in 0.24s. The free Demo
      # key lifts the datacentre-IP block. Without it BTC dominance and total
      # market cap are missing from the crypto bar and the analyst's context.
      - key: COINGECKO_API_KEY
        sync: false   # User adds via Render dashboard (not in git)
